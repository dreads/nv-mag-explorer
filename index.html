<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NV Magnetometry — Why Ramsey?</title>
<meta name="description" content="Why a real NV-diamond magnetometer measures with Ramsey interferometry instead of reading Rabi oscillations directly, and how the same coherence budget that limits entanglement in bell-state-explorer limits this measurement too.">
<link rel="stylesheet" href="src/styles.css">
</head>
<body>
<a class="skip-link" href="#main" data-i18n="ui.skipLink">Skip to content</a>
<div class="wrap">

<header>
  <div class="lang-row">
    <label for="locale-picker" data-i18n="ui.languageLabel">Language</label>
    <select id="locale-picker">
      <!-- Self-referential language name (like every other bundle's own
           endonym), not translated content — exempt from i18n-coverage scan -->
      <option value="en" data-i18n-exempt>English</option>
    </select>
  </div>
</header>

<main id="main">
  <div class="hero-row">
    <nav class="panel explore-col" aria-label="Visualizers">
      <h2 class="explore-title" data-i18n="ui.navHeading"><span class="dot" aria-hidden="true"></span>Explore the visualizers</h2>
      <!-- Cards are rendered by src/app.js's renderCatalog() from
           src/catalog.js -- see that file to add a new visualizer instead
           of hand-editing markup here. -->
      <div id="catalog-cards"></div>
    </nav>

    <!-- Spotlight panel: reacts to hover/focus on the cards above (see
         setSpotlight() in src/app.js). Starts on DEFAULT_SPOTLIGHT (a Bloch
         golf still, not tied to any one visualizer) so it degrades to a
         correct, fully static view with no JS at all. -->
    <section class="panel hero-video">
      <video id="spotlight-video" class="bloch-hero" autoplay loop muted playsinline aria-hidden="true" hidden>
        <source src="doc/media/bloch-sweep.mp4" type="video/mp4">
      </video>
      <img id="spotlight-image" class="bloch-hero" src="doc/bloch_golf.jpg" aria-hidden="true" alt="">
      <p id="spotlight-caption" class="hero-caption" aria-live="polite" data-i18n="ui.toolboxCaption">
        This is a toolbox for exploring quantum-sensing concepts as intuitively as possible — hover or
        focus a visualizer to preview it here.
      </p>
    </section>
  </div>
</main>

</div>
<script type="module" src="src/app.js"></script>
</body>
</html>
